  ['mail', EMAIL, `mailto:${EMAIL}`],

  ['github', 'github.com/Carlos-j24', 'https://github.com/Carlos-j24'],
  ['linkedin', 'in/carlos-castro-lpz', 'https://linkedin.com/in/carlos-castro-lpz/']
].filter(Boolean)

$('contact').innerHTML = contact.map(([name, text, href]) =>
  `<li>${icon(name)}${href ? `<a href="${href}">${esc(text)}</a>` : esc(text)}</li>`).join('')

$('stack').innerHTML = t.stack.map(([title, items, kind]) => `
  <div class="group"><b>${esc(title)}</b>
    <div class="chips">${items.map((i) => `<span class="chip ${kind ?? ''}">${esc(i)}</span>`).join('')}</div>
  </div>`).join('')

$('languages').innerHTML = t.languages.map(([name, level, pct]) => `
  <div class="lang"><p><b>${esc(name)}</b><span>${esc(level)}</span></p><div class="bar"><i style="width:${pct}%"></i></div></div>`).join('')

$('strengths').innerHTML = t.strengths.map((s) => `<li>${esc(s)}</li>`).join('')
$('profile').innerHTML = rich(t.profile)

$('ai').innerHTML = `
  <p class="ai-level"><span class="mono">${esc(t.aiLabel)}</span><strong>${esc(t.aiLevel)}</strong><span>${esc(t.aiNote)}</span></p>
  ${bullets(t.ai)}`

const f = t.featured
const projectHead = (p) => `
  <div class="project-head">
    <p class="project-title">${esc(p.title)} <span>— ${esc(p.tagline)}</span></p>
    ${p.url ? `<a class="url" href="https://${p.url}">${esc(p.url)}</a>` : `<span class="status">${esc(p.status ?? '')}</span>`}
  </div>
  <p class="stack">${esc(p.stack)}</p>`

$('projects').innerHTML = `
  <div class="featured">
    <span class="pill">${esc(f.pill)}</span>
    ${projectHead(f)}
    <div class="states">${f.states.map(([kind, label, text]) => `<div class="state ${kind}"><p>${esc(label)}</p><p>${esc(text)}</p></div>`).join('')}</div>
    ${bullets(f.bullets)}
  </div>
  ${t.projects.map((p) => `<div class="project">${projectHead(p)}${bullets(p.bullets)}</div>`).join('')}`

$('experience').innerHTML = t.experience.map((e) => `
  <div class="item"><p class="item-title">${esc(e.title)}</p><p class="item-place">${esc(e.place)}</p>${bullets(e.bullets)}</div>`).join('')

$('education').innerHTML = t.education.map(([title, place]) => `
  <div class="item"><p class="item-title">${esc(title)}</p><p class="item-place">${esc(place)}</p></div>`).join('')
</script>
</body>
</html>
