<link rel="preconnect" href="https://fonts.googleapis.com" />

  header {

  .location {

    font-size: 8.4pt;
    color: var(--muted);
    text-align: right;
    line-height: 1.6;
  }

  .layout {
    display: grid;
    grid-template-columns: 2.62in 1fr;
    flex: 1;
    min-height: 0;
  }

  aside {
    background: var(--side);
    padding: 0.24in 0.28in 0.3in 0.5in;
  }

  main { padding: 0.24in 0.5in 0.3in 0.34in; }

  h2 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8.2pt;
    font-weight: 500;
    letter-spacing: 0.18em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 7px;
  }

  section + section { margin-top: 12px; }

  aside { font-size: 8.6pt; }

  .contact li { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .contact svg { width: 12px; height: 12px; flex-shrink: 0; stroke: var(--ink); }

  .group + .group { margin-top: 7px; }
  .group b { display: block; font-weight: 600; }
  .group p { color: var(--muted); }

  ul { list-style: none; }

  .entry + .entry { margin-top: 8px; }

  .entry-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .entry-title { font-size: 10.6pt; font-weight: 600; }
  .entry-title span { font-weight: 400; color: var(--muted); }
  .date { font-family: 'IBM Plex Mono', monospace; font-size: 8.2pt; color: var(--muted); white-space: nowrap; }

  .stack { font-family: 'IBM Plex Mono', monospace; font-size: 7.9pt; color: var(--accent); margin: 1px 0 3px; }
  .place { color: var(--muted); }

  .bullets li { position: relative; padding-left: 12px; margin-top: 1px; }
  .bullets li::before { content: '•'; position: absolute; left: 1px; }

  .link a { white-space: nowrap; text-decoration: underline; text-decoration-color: #b8c4c2; text-underline-offset: 2px; }

</head>
